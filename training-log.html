<title>Night Reps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 하단 여백 있는 단일 컬럼 모바일 우선 앱. 상단 고정 탭, 본문은 카드 스택. 숫자는 Barlow Condensed(운동 기록판 느낌). */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E8ECF3; --line:#D3DAE6;
  --fg:#121A27; --muted:#59657A;
  --accent:#6A3BD9; --accent-fg:#FFFFFF; --accent-soft:#ECE4FF;
  --good:#12744A; --good-soft:#DAF2E6;
  --warn:#8F5400; --warn-soft:#FFEDCC;
  --bad:#B3261E; --bad-soft:#FCE2E0;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D121A; --surface:#161D28; --surface2:#202938; --line:#2D3849;
    --fg:#E8EDF5; --muted:#97A3B6;
    --accent:#C084FC; --accent-fg:#0D121A; --accent-soft:#35285C;
    --good:#5BD39A; --good-soft:#14332A;
    --warn:#F2B65A; --warn-soft:#3A2C12;
    --bad:#FF8F85; --bad-soft:#3D1C1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121A; --surface:#161D28; --surface2:#202938; --line:#2D3849;
  --fg:#E8EDF5; --muted:#97A3B6;
  --accent:#C084FC; --accent-fg:#0D121A; --accent-soft:#35285C;
  --good:#5BD39A; --good-soft:#14332A;
  --warn:#F2B65A; --warn-soft:#3A2C12;
  --bad:#FF8F85; --bad-soft:#3D1C1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 120px}
#app{max-width:560px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--font-num);font-size:24px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud::before{background:var(--good)}
.sync.saving::before{background:var(--warn)}
.sync.err::before{background:var(--bad)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 0;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:700}

main{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.datebar{display:flex;align-items:center;gap:8px}
.datebar .label{flex:1;text-align:center;font-weight:700;font-size:17px}
.datebar .label small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.ico{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:16px}
.ico:disabled{opacity:.35;cursor:default}
.ico.sm{width:32px;height:32px;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.chip.add{border-style:dashed;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}

.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted)}
input[type=text],input.num,textarea,select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;font-size:16px}
textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical}
input.num{font-family:var(--font-num);font-weight:600;font-size:22px;text-align:center;padding:0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:3px;border-radius:10px}
.seg button{border:0;background:transparent;border-radius:8px;height:38px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700}

.notice{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice.good{background:var(--good-soft);color:var(--good)}
.notice .row{width:100%}

.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-title{min-width:0}
.ex-title h3{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.ref{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.ex-tools{display:flex;gap:6px;flex-shrink:0}
.sets{display:flex;flex-direction:column;gap:8px}
.set-h,.set{display:grid;grid-template-columns:26px 1fr 14px 1fr 44px 32px;gap:6px;align-items:center}
.set-h{font-size:11px;color:var(--muted);text-align:center}
.set .n{font-family:var(--font-num);font-size:18px;color:var(--muted);text-align:center}
.set .x{text-align:center;color:var(--muted)}
.chk{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--muted)}
.chk.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.set .del{border:0;background:transparent;color:var(--muted);font-size:15px;height:44px}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exvol{font-family:var(--font-num);font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}

.addrow{display:flex;gap:8px}
.addrow input{flex:1}

.pain{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pain:first-of-type{border-top:0;padding-top:0}
.pain-h{display:flex;justify-content:space-between;align-items:center}
.pain-h strong{font-size:15px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.lv button{border:1px solid var(--line);background:var(--bg);border-radius:8px;height:38px;font-size:13px;color:var(--muted)}
.lv button[aria-pressed="true"].l0{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.lv button[aria-pressed="true"].l1{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.lv button[aria-pressed="true"].l2,.lv button[aria-pressed="true"].l3{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}

pre.summary{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--font-body);font-size:14px}
.empty{color:var(--muted);font-size:14px}
#bars{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-direction:column;gap:6px}
.bar-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:baseline}
.bar-h span:first-child{color:var(--muted)}
.bar-v{font-family:var(--font-num);font-size:16px;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px}
.fill.good{background:var(--good)}.fill.warn{background:var(--warn)}
.meal{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.meal:first-of-type{border-top:0;padding-top:0}
.meal-t{overflow-wrap:anywhere}
.meal-n{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;align-items:center}
input.num.sm{font-size:18px;height:40px}
.meal .del{border:0;background:transparent;color:var(--muted);height:40px}
.closing{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
textarea[hidden]{display:none}
.tagline{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.tip{font-size:12px;color:var(--accent);margin-top:2px;overflow-wrap:anywhere}
.linkbtn{border:0;background:transparent;color:var(--accent);font-size:12px;padding:6px 0;text-decoration:underline}
.exedit{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.chk-l{display:flex;gap:8px;align-items:center;font-size:13px}
.chk-l input{width:20px;height:20px}
.track.mark{position:relative}
.track.mark::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--fg);opacity:.35}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:5px}
.msg.coach{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.err{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.coachin{display:flex;gap:8px;align-items:flex-end}
.coachin textarea{flex:1;min-height:48px}
.coachin .btn{min-width:60px;height:48px}
.ctx{font-size:12px;color:var(--muted);text-align:center}
details.card summary{cursor:pointer;font-weight:700;font-size:14px}
details.card textarea{min-height:200px;margin-top:10px}

.hist{display:flex;flex-direction:column;gap:8px}
.hist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;width:100%}
.hist .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hist .l2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hist .num{font-family:var(--font-num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500}
.badge.l0{background:var(--good-soft);color:var(--good)}
.badge.l1{background:var(--warn-soft);color:var(--warn)}
.badge.l2,.badge.l3{background:var(--bad-soft);color:var(--bad)}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{fill:var(--muted);font-size:11px;font-family:var(--font-num)}
svg .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg .area{fill:var(--accent-soft);stroke:none}
svg .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg .dot.last{fill:var(--accent)}
svg .val{fill:var(--fg);font-size:13px;font-weight:700;font-family:var(--font-num)}

#timerbar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin-inline:auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:9}
#timerbar[hidden]{display:none}
#timerbar .t{font-family:var(--font-num);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#timerbar .m{font-size:13px;opacity:.8}
#timerbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;height:40px;padding:0 14px}
@media (prefers-reduced-motion:no-preference){.chk,.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><h1>NIGHT REPS</h1><span id="sync" class="sync">불러오는 중</span></div>
    <nav class="tabs" role="tablist" aria-label="화면">
      <button role="tab" data-act="tab" data-tab="today" aria-selected="true">오늘</button>
      <button role="tab" data-act="tab" data-tab="coach" aria-selected="false">코치</button>
      <button role="tab" data-act="tab" data-tab="history" aria-selected="false">기록</button>
      <button role="tab" data-act="tab" data-tab="trend" aria-selected="false">추이</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="timerbar" hidden><div><div class="t" id="tleft">0:00</div><div class="m" id="tmsg">세트 사이 휴식</div></div><button data-act="timerStop">닫기</button></div>

<script>
(function(){
"use strict";

/* ---------- 유틸 ---------- */
var WD=["일","월","화","수","목","금","토"];
var LV=["이상 없음","경미","찌릿","중단"];
var PRESET={
  "가슴·삼두":["인클라인프레스머신","인클라인스미스머신","체스트프레스","레버리지체스트프레스","딥스머신","케이블푸시다운"],
  "등·이두":["랫풀다운","시티드로우","풀업","암풀다운","바벨컬","덤벨컬"],
  "하체A":["레그프레스","레그컬","레그익스텐션","카프레이즈","스쿼트","힙쓰러스트"],
  "하체B":["스쿼트","루마니안데드리프트","힙쓰러스트","레그컬","어덕터","어브덕터"],
  "어깨":["숄더프레스머신","사이드레터럴레이즈","리어델트플라이","페이스풀"],
  "휴식":[]
};
var SPLITS=Object.keys(PRESET);
var AREAS=["어깨","발목","무릎","허리","손목","팔꿈치","목"];
var OBS_FOLDER="1IsOeDNrx_IRPYKzfG9gkZazfc8S4oBHV";
var MUSCLES=["가슴","등","어깨","이두","삼두","대퇴사두","햄스트링","둔근","종아리","복근","기타"];
var PATTERNS=[["press","프레스"],["pull","당기기"],["squat","스쿼트"],["hinge","힌지"],["curl","컬"],["extension","익스텐션"],["raise","레이즈"],["fly","플라이"],["calf","카프"],["core","코어"],["other","기타"]];
var DEFAULTS=["레그프레스","체스트프레스","랫풀다운","숄더프레스머신","스쿼트","시티드로우"];
var PROFILE_DEFAULT="[회원 프로필 — 절대 잊지 말 것]\n- 만 32세 남성, 175cm / 약 80kg\n- 목표: 린벌크(하루 2,850~2,900kcal, 단백질 160g) 후 커팅 전환\n- 밤 22시 이후에만 운동 가능(직업 특성). 주 4일 상/하체 분할. 경력 1~3년\n- 어깨·발목 부상으로 3개월 쉬고 복귀한 지 얼마 안 됨 → 복귀 페이즈(2~3주)\n  · 룰: 예전 무게의 50~60%, 모든 종목 첫 세트는 가볍게 테스트, 관절 찌릿하면 그 동작 즉시 중단\n  · 어깨: 견갑 고정 시 통증 없음 확인됨. 프레스 몰빵 금지(하루 3종목 이내), 딥스는 마지막, 당기기로 밸런스\n  · 발목: 7/10 첫 테스트에서 레그프레스 60→90kg 4세트 이상 없음. 스쿼트는 가동범위 축소로 복귀 고려\n- 수면 과제: 새벽 2:30 취침 습관 → 1:30 이전 목표. 수면 7시간 사수\n- 위장 예민(매스틱검 복용). 자기 전 맵고 기름진 음식 금지\n- 카페인 컷오프 17시";
var PERSONA="너는 이 회원의 개인 헬스 트레이너다. 엄청 친한 사이라 반말로 카톡하듯 짧고 시원하게 대화한다(이모지 가끔, ㅋㅋ 가능). 근거 있는 코칭을 하되 잔소리는 핵심만. 위험 신호(관절 통증, 수면 부족, 복귀 페이즈 룰 위반)는 확실하게 잡아주고, 부상 위험이 있는 요청은 대안을 제시하며 말린다. 운동·체중·통증 기록은 앱에 이미 구조화되어 아래에 있으니 다시 묻지 말고 활용하되, 기록에 없는 건 물어봐라. 답변은 보통 3~6문장 이내로 짧게.";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,8);}

function fmt(n){return Number.isInteger(n)?String(n):String(+n.toFixed(1));}
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function md(s){var d=parse(s);return (d.getMonth()+1)+"/"+d.getDate();}
function clone(o){return JSON.parse(JSON.stringify(o));}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

/* ---------- 상태 ---------- */
var TODAY=ymd(new Date());
var S={days:{},date:TODAY,tab:"today",armed:null,trendEx:"",coach:{messages:[],summary:"",profile:"",updatedAt:0,goal:{kcal:2850,protein:160},exInfo:{}},draft:"",sample:null,sampleChecked:false,coachBusy:false,liveText:"",mcp:null,obsBusy:false,obsErr:"",editEx:"",classifying:{},clsBusy:false};
var dbh=null;

function blank(date){return {date:date,split:"",exercises:[],weight:null,sleep:null,diet:"",pain:{},morning:null,note:"",updatedAt:0,meals:[],closing:"",saved:null};}
function day(){if(!S.days[S.date])S.days[S.date]=blank(S.date);return S.days[S.date];}
function hasContent(d){return !!(d&&(d.split||d.exercises.length||d.weight!=null||d.sleep!=null||d.diet||Object.keys(d.pain||{}).length||d.note||d.morning||(d.meals&&d.meals.length)||d.closing));}
function normalize(d,date){
  var b=blank(date);
  if(!d||typeof d!=="object")return b;
  b.split=d.split||"";b.weight=d.weight==null?null:d.weight;b.sleep=d.sleep==null?null:d.sleep;
  b.diet=d.diet||"";b.pain=(d.pain&&typeof d.pain==="object")?d.pain:{};b.morning=d.morning||null;b.note=d.note||"";b.updatedAt=d.updatedAt||0;b.closing=d.closing||"";b.saved=d.saved||null;
  b.meals=(Array.isArray(d.meals)?d.meals:[]).map(function(m){return {id:m.id||uid(),text:String(m.text||""),kcal:m.kcal==null?null:m.kcal,protein:m.protein==null?null:m.protein};});
  b.exercises=(Array.isArray(d.exercises)?d.exercises:[]).map(function(e){
    return {id:e.id||uid(),name:String(e.name||""),sets:(Array.isArray(e.sets)?e.sets:[]).map(function(s){return {w:s.w==null?null:s.w,r:s.r==null?null:s.r,done:!!s.done};})};
  });
  return b;
}

/* ---------- 저장 (클라우드 db + 기기 localStorage) ---------- */
var LS_KEY="tlog.v1";
function lsSave(){
  var out={};Object.keys(S.days).forEach(function(k){if(hasContent(S.days[k]))out[k]=S.days[k];});
  lsSet(LS_KEY,JSON.stringify(out));
}
function lsLoad(){
  try{var o=JSON.parse(lsGet(LS_KEY)||"{}");Object.keys(o).forEach(function(k){S.days[k]=normalize(o[k],k);});}catch(e){}
}
var LS_COACH="tlog.coach",coachTimer=null;
function coachLoad(){
  try{var o=JSON.parse(lsGet(LS_COACH)||"null");if(o&&typeof o==="object"){S.coach.messages=Array.isArray(o.messages)?o.messages:[];S.coach.summary=o.summary||"";S.coach.profile=o.profile||"";S.coach.updatedAt=o.updatedAt||0;if(o.goal&&o.goal.kcal&&o.goal.protein)S.coach.goal=o.goal;S.coach.exInfo=(o.exInfo&&typeof o.exInfo==="object")?o.exInfo:{};}}catch(e){}
  if(!S.coach.profile)S.coach.profile=PROFILE_DEFAULT;
}
function coachPersist(){
  S.coach.updatedAt=Date.now();
  lsSet(LS_COACH,JSON.stringify(S.coach));
  if(!dbh)return;
  clearTimeout(coachTimer);
  coachTimer=setTimeout(async function(){try{await dbh.doc("meta/coach").set(clone(S.coach));}catch(e){}},800);
}
var pending={},timer=null,flushing=false;
function setSync(kind){
  var el=document.getElementById("sync");if(!el)return;
  var map={cloud:["cloud","클라우드에 저장됨"],saving:["saving","저장 중…"],local:["","이 기기에만 저장"],err:["err","클라우드 저장 실패 · 기기에는 저장됨"]};
  el.className="sync "+map[kind][0];el.textContent=map[kind][1];
}
function persist(date){
  pending[date]=true;lsSave();
  if(!dbh){setSync("local");return;}
  setSync("saving");clearTimeout(timer);timer=setTimeout(flush,600);
}
async function flush(){
  if(flushing){timer=setTimeout(flush,300);return;}
  flushing=true;
  try{
    var dates=Object.keys(pending);
    for(var i=0;i<dates.length;i++){
      var k=dates[i];delete pending[k];
      if(S.days[k]&&hasContent(S.days[k]))await dbh.collection("sessions").doc(k).set(clone(S.days[k]));
    }
    setSync("cloud");
  }catch(e){setSync("err");}
  flushing=false;
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)throw 0;
    var db=await window.claude.use("db");
    if(!db)throw 0;
    var snap=await db.collection("sessions").get();
    dbh=db;
    snap.docs.forEach(function(doc){
      var r=doc.data();if(!r)return;
      var id=doc.id,l=S.days[id];
      if(!l||(r.updatedAt||0)>(l.updatedAt||0)){S.days[id]=normalize(r,id);}
      else if((l.updatedAt||0)>(r.updatedAt||0)){pending[id]=true;}
    });
    Object.keys(S.days).forEach(function(k){if(hasContent(S.days[k])&&!snap.docs.some(function(d){return d.id===k;}))pending[k]=true;});
    lsSave();
    try{
      var cs=await db.doc("meta/coach").get();
      if(cs.exists){
        var cr=cs.data();
        if((cr.updatedAt||0)>(S.coach.updatedAt||0)){S.coach.messages=cr.messages||[];S.coach.summary=cr.summary||"";S.coach.profile=cr.profile||S.coach.profile;if(cr.goal&&cr.goal.kcal&&cr.goal.protein)S.coach.goal=cr.goal;if(cr.exInfo&&typeof cr.exInfo==="object")S.coach.exInfo=cr.exInfo;S.coach.updatedAt=cr.updatedAt||0;lsSet(LS_COACH,JSON.stringify(S.coach));}
      }else if(S.coach.updatedAt){coachPersist();}
    }catch(e){}
    var a=document.activeElement;
    if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();
    if(Object.keys(pending).length){setSync("saving");flush();}else setSync("cloud");
  }catch(e){dbh=null;setSync("local");}
}

/* ---------- 종목 분류 ---------- */
function guess(name){
  var n=name,m="기타",pt="other";
  if(/리어델트|페이스풀/.test(n)){m="어깨";pt="pull";}
  else if(/레그프레스|핵스쿼트/.test(n)){m="대퇴사두";pt="press";}
  else if(/스쿼트|런지|레그익스텐션/.test(n)){m="대퇴사두";pt=/익스텐션/.test(n)?"extension":"squat";}
  else if(/레그컬|햄스트링/.test(n)){m="햄스트링";pt="curl";}
  else if(/루마니안|데드리프트|굿모닝/.test(n)){m="햄스트링";pt="hinge";}
  else if(/트라이셉|푸시다운|스컬|프렌치|딥스|삼두/.test(n)){m="삼두";pt=/딥스/.test(n)?"press":"extension";}
  else if(/힙쓰러스트|브릿지|킥백|어브덕터|어덕터|글루트/.test(n)){m="둔근";pt="hinge";}
  else if(/카프|종아리/.test(n)){m="종아리";pt="calf";}
  else if(/랫풀|풀다운|풀업|친업|로우|암풀/.test(n)){m="등";pt="pull";}
  else if(/숄더|사이드|레터럴|프론트레이즈|업라이트/.test(n)){m="어깨";pt=/프레스/.test(n)?"press":"raise";}
  else if(/컬|이두/.test(n)){m="이두";pt="curl";}
  else if(/체스트|벤치|인클라인|디클라인|펙덱|플라이|푸시업|크로스오버/.test(n)){m="가슴";pt=/플라이|펙덱|크로스/.test(n)?"fly":"press";}
  else if(/크런치|플랭크|복근|레그레이즈|싯업/.test(n)){m="복근";pt="core";}
  return {muscle:m,secondary:"",pattern:pt,assist:/어시스트/.test(n),tip:"",src:"규칙"};
}
function info(name){return (S.coach.exInfo&&S.coach.exInfo[name])||guess(name);}
function isPress(name){var i=info(name);return (i.pattern==="press"&&(i.muscle==="가슴"||i.muscle==="어깨"))||/딥스/.test(name);}
function patLabel(k){for(var i=0;i<PATTERNS.length;i++)if(PATTERNS[i][0]===k)return PATTERNS[i][1];return "기타";}
function softRender(){var a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();}
async function classify(names){
  names=names.filter(function(n,i){return n&&names.indexOf(n)===i&&!S.coach.exInfo[n]&&!S.classifying[n];});
  if(!names.length||!S.sample)return;
  names.forEach(function(n){S.classifying[n]=1;});
  try{
    var res=await S.sample.json('다음 헬스 종목들을 분류해. JSON 배열만 출력. 각 항목: {"name":"입력 그대로","muscle":"가슴|등|어깨|이두|삼두|대퇴사두|햄스트링|둔근|종아리|복근|기타 중 하나(주동근)","secondary":"보조근 최대 2개를 · 로 연결한 문자열, 없으면 빈 문자열","pattern":"press|pull|squat|hinge|curl|extension|raise|fly|calf|core|other 중 하나","assist":true면 어시스트 머신(중량 숫자가 클수록 쉬워지는 머신, 예: 어시스트 풀업),"tip":"어깨·발목 부상에서 복귀 중인 회원이 주의할 점 한 문장(40자 이내)"}\n\n종목: '+JSON.stringify(names),{modelTier:"quick"});
    if(Array.isArray(res))res.forEach(function(r){
      if(!r||names.indexOf(r.name)<0)return;
      var pk=PATTERNS.map(function(x){return x[0];});
      S.coach.exInfo[r.name]={muscle:MUSCLES.indexOf(r.muscle)>=0?r.muscle:"기타",secondary:String(r.secondary||"").slice(0,30),pattern:pk.indexOf(r.pattern)>=0?r.pattern:"other",assist:r.assist===true,tip:String(r.tip||"").slice(0,60),src:"AI"};
    });
    coachPersist();
  }catch(e){}
  names.forEach(function(n){delete S.classifying[n];});
  softRender();
}
function allUnclassified(){
  var u={};
  Object.keys(S.days).forEach(function(k){S.days[k].exercises.forEach(function(e){if(e.name&&!S.coach.exInfo[e.name])u[e.name]=1;});});
  return Object.keys(u);
}
async function classifyAll(){
  if(S.clsBusy||!S.sample)return;
  S.clsBusy=true;render();
  await classify(allUnclassified().slice(0,25));
  S.clsBusy=false;render();
}
function tagHtml(e){
  var i=info(e.name),busy=!!S.classifying[e.name];
  var t=i.muscle+(i.secondary?" · 보조 "+i.secondary:"")+" · "+patLabel(i.pattern)+(i.assist?" · 어시스트":"")+(busy?" · 분류 중…":i.src==="규칙"?" · 이름 규칙 추정":"");
  var h='<p class="tagline">'+esc(t)+'</p>'+(i.tip?'<p class="tip">'+esc(i.tip)+'</p>':"")
    +'<button class="linkbtn" data-act="editEx" data-ex="'+e.id+'">'+(S.editEx===e.id?"분류 닫기":"분류 수정")+'</button>';
  return h;
}
function editPanel(e){
  var i=info(e.name),h="";
  if(S.editEx===e.id){
    h+='<div class="exedit"><div class="fields"><div class="field"><label for="m-'+e.id+'">주동근</label><select id="m-'+e.id+'" data-f="exMuscle" data-ex="'+e.id+'">'
      +MUSCLES.map(function(m){return '<option'+(m===i.muscle?" selected":"")+'>'+m+'</option>';}).join("")+'</select></div>'
      +'<div class="field"><label for="p-'+e.id+'">동작 유형</label><select id="p-'+e.id+'" data-f="exPattern" data-ex="'+e.id+'">'
      +PATTERNS.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===i.pattern?" selected":"")+'>'+x[1]+'</option>';}).join("")+'</select></div></div>'
      +'<label class="chk-l"><input type="checkbox" data-f="exAssist" data-ex="'+e.id+'"'+(i.assist?" checked":"")+'> 어시스트 머신 (숫자가 클수록 쉬워요. 볼륨에서 제외)</label></div>';
  }
  return h;
}
function weeklyCard(){
  var cut=shift(TODAY,-6),cnt={};
  Object.keys(S.days).forEach(function(k){
    if(k<cut||k>TODAY)return;
    S.days[k].exercises.forEach(function(e){
      var n=e.sets.filter(function(x){return x.r!=null&&x.r>0;}).length;
      if(!n)return;
      var m=info(e.name).muscle;cnt[m]=(cnt[m]||0)+n;
    });
  });
  var rows=MUSCLES.filter(function(m){return cnt[m];}).map(function(m){
    return '<div class="bar"><div class="bar-h"><span>'+m+'</span><span class="bar-v">'+cnt[m]+'세트</span></div><div class="track mark"><div class="fill" style="width:'+Math.min(100,cnt[m]/20*100).toFixed(1)+'%"></div></div></div>';
  }).join("");
  var unk=allUnclassified();
  return '<section class="card"><h2>최근 7일 부위별 세트</h2>'
    +(rows?'<div style="display:flex;flex-direction:column;gap:12px">'+rows+'</div><p class="empty">막대 끝은 20세트, 중간선은 10세트예요. 주당 10~20세트는 일반적인 근비대 권장 범위일 뿐 개인 목표가 아니에요. 주동근 기준이고 어시스트 종목도 세트로 세어요.</p>':'<p class="empty">최근 7일 기록이 쌓이면 부위별 세트 수가 나와요.</p>')
    +(unk.length?'<button class="btn" data-act="classifyAll"'+(S.sample&&!S.clsBusy?"":" disabled")+'>'+(S.clsBusy?"분류 중…":"분류 안 된 종목 "+unk.length+"개 AI로 분류")+'</button><p class="empty">분류 전에는 이름 규칙으로 추정한 값을 써요.</p>':"")+'</section>';
}

/* ---------- 계산 ---------- */
function setsStr(sets){return sets.filter(function(s){return s.w!=null||s.r!=null;}).map(function(s){return fmt(s.w==null?0:s.w)+"×"+(s.r==null?0:s.r);}).join(" ");}
function exVol(e){if(info(e.name).assist)return 0;return e.sets.reduce(function(a,s){return a+((s.w!=null&&s.r!=null)?s.w*s.r:0);},0);}
function dayVol(d){return d.exercises.reduce(function(a,e){return a+exVol(e);},0);}
function lastOf(name,before){
  var ks=Object.keys(S.days).filter(function(k){return k<before;}).sort().reverse();
  for(var i=0;i<ks.length;i++){
    var e=S.days[ks[i]].exercises.find(function(x){return x.name===name&&x.sets.some(function(s){return s.w!=null||s.r!=null;});});
    if(e)return {date:ks[i],sets:e.sets};
  }
  return null;
}
function suggestions(){
  var d=day(),freq={};
  Object.keys(S.days).forEach(function(k){S.days[k].exercises.forEach(function(e){if(e.name)freq[e.name]=(freq[e.name]||0)+1;});});
  var hist=Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];});
  var base=d.split?PRESET[d.split]:(hist.length?[]:DEFAULTS);
  var have={};d.exercises.forEach(function(e){have[e.name]=1;});
  var seen={},out=[];
  base.concat(hist).forEach(function(n){if(!have[n]&&!seen[n]){seen[n]=1;out.push(n);}});
  return out.slice(0,14);
}
function warnings(d){
  var w=[];
  var press=d.exercises.filter(function(e){return isPress(e.name);});
  if(press.length>3)w.push({t:"warn",m:"프레스 계열이 "+press.length+"종목이에요. 어깨 보호 룰은 하루 3종목 이내입니다."});
  var di=d.exercises.findIndex(function(e){return /딥스/.test(e.name);});
  if(di>=0&&di<d.exercises.length-1)w.push({t:"info",m:"딥스는 마지막 순서로 두기로 했어요."});
  Object.keys(d.pain).forEach(function(a){var p=d.pain[a];if(p.level>=2)w.push({t:"bad",m:a+" "+LV[p.level]+": 해당 동작은 멈추고 무게는 동결. 다음 날 아침 관절 통증을 확인하세요."});});
  return w;
}
function mealTotals(d){var k=0,p=0;(d.meals||[]).forEach(function(m){k+=m.kcal||0;p+=m.protein||0;});return {kcal:k,protein:p};}
function summaryText(d){
  var dt=parse(d.date);
  var L=["오늘 총정리 ("+(d.split||"운동")+" · "+WD[dt.getDay()]+"요일 · "+(dt.getMonth()+1)+"/"+dt.getDate()+")"];
  d.exercises.forEach(function(e){var s=setsStr(e.sets).split(" ").join(", ");if(s)L.push("* "+e.name+" ("+info(e.name).muscle+"): "+s);});
  var v=[];
  if(d.weight!=null)v.push("체중 "+fmt(d.weight)+"kg");
  if(d.sleep!=null)v.push("수면 "+fmt(d.sleep)+"시간");
  if(d.diet)v.push("식단 "+d.diet);
  if(v.length)L.push(v.join(" · "));
  if(d.meals&&d.meals.length){var mt=mealTotals(d);L.push("식단: "+d.meals.map(function(m){return m.text;}).join(" / "));L.push("섭취 "+Math.round(mt.kcal).toLocaleString("ko-KR")+"kcal · 단백질 "+Math.round(mt.protein)+"g (목표 "+S.coach.goal.kcal+"/"+S.coach.goal.protein+")");}
  var vol=dayVol(d);if(vol>0)L.push("총 볼륨 "+Math.round(vol).toLocaleString("ko-KR")+"kg");
  var pk=Object.keys(d.pain);
  if(pk.length)L.push("통증: "+pk.map(function(a){var p=d.pain[a];return a+" "+LV[p.level]+(p.note?"("+p.note+")":"");}).join(", "));
  if(d.morning)L.push("다음 날 아침 관절: "+(d.morning==="ok"?"이상 없음":"통증 있음"));
  if(d.note)L.push("메모: "+d.note);
  return L.join("\n");
}

/* ---------- 렌더 ---------- */
var view=document.getElementById("view");
function render(){
  var y=window.scrollY;
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===S.tab));});
  view.innerHTML=S.tab==="today"?renderToday():S.tab==="coach"?renderCoach():S.tab==="history"?renderHistory()+backupHtml():renderTrend();
  window.scrollTo(0,y);
}
function dateLabel(){
  var d=parse(S.date);
  var rel=S.date===TODAY?"오늘":S.date===shift(TODAY,-1)?"어제":S.date===shift(TODAY,1)?"내일":"";
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")"+(rel?"<small>"+rel+"</small>":"<small>"+d.getFullYear()+"</small>");
}
function noticeHtml(list){
  return list.map(function(n){return '<div class="notice '+n.t+'">'+esc(n.m)+'</div>';}).join("");
}
function morningHtml(d){
  var pv=S.days[shift(S.date,-1)];
  if(!pv)return "";
  var areas=Object.keys(pv.pain||{}).filter(function(a){return pv.pain[a].level>=1;});
  if(!areas.length)return "";
  var what=areas.map(function(a){return a+" "+LV[pv.pain[a].level];}).join(", ");
  if(d.morning){
    return '<div class="notice '+(d.morning==="ok"?"good":"bad")+'">어제 '+esc(what)+' → 아침 관절 '+(d.morning==="ok"?"이상 없음":"통증 있음")+'</div>';
  }
  return '<div class="notice warn"><div class="row"><span style="flex:1;min-width:180px">어제 '+esc(what)+'. 오늘 아침 관절 통증(근육통 말고)이 있었나요?</span>'
    +'<button class="btn" data-act="morning" data-v="ok">없음</button><button class="btn" data-act="morning" data-v="pain">있음</button></div></div>';
}
function setRow(e,s,i){
  return '<div class="set"><span class="n">'+(i+1)+'</span>'
   +'<input class="num" inputmode="decimal" data-f="w" data-ex="'+e.id+'" data-i="'+i+'" value="'+(s.w==null?"":esc(s.w))+'" aria-label="'+(i+1)+'세트 무게(kg)" placeholder="kg">'
   +'<span class="x">×</span>'
   +'<input class="num" inputmode="numeric" data-f="r" data-ex="'+e.id+'" data-i="'+i+'" value="'+(s.r==null?"":esc(s.r))+'" aria-label="'+(i+1)+'세트 횟수" placeholder="회">'
   +'<button class="chk'+(s.done?" on":"")+'" data-act="done" data-ex="'+e.id+'" data-i="'+i+'" aria-pressed="'+!!s.done+'" aria-label="'+(i+1)+'세트 완료">✓</button>'

function chart(pts){
  if(pts.length<2)return '<p class="empty">기록이 2개 이상 쌓이면 그래프가 나와요.</p>';
  var W=340,H=170,L=40,R=16,T=22,B=26;
  var ys=pts.map(function(p){return p.y;});
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  var lo=mn,hi=mx;if(lo===hi){lo-=1;hi+=1;}
  var padv=(hi-lo)*0.12;lo-=padv;hi+=padv;
  function X(i){return L+(W-L-R)*i/(pts.length-1);}
  function Y(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo));}
  var line=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1);}).join(" ");
  var area=line+" L"+X(pts.length-1).toFixed(1)+" "+(H-B)+" L"+X(0).toFixed(1)+" "+(H-B)+" Z";
  var ticks=mn===mx?[mn]:[mn,mx];
  var s='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="추이 그래프">';
  ticks.forEach(function(v){s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="axis" x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+fmt(v)+'</text>';});
  s+='<path class="area" d="'+area+'"/><path class="line" d="'+line+'"/>';
  pts.forEach(function(p,i){s+='<circle class="dot'+(i===pts.length-1?" last":"")+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===pts.length-1?4.5:3.5)+'"/>';});
  var lp=pts[pts.length-1];
  s+='<text class="val" x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(lp.y)-9).toFixed(1)+'" text-anchor="end">'+fmt(lp.y)+'</text>';
  s+='<text class="axis" x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+esc(pts[0].x)+'</text><text class="axis" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(pts[pts.length-1].x)+'</text></svg>';
  return s;
}
function renderTrend(){

  var list=Object.keys(names).sort();

    var e=S.days[k].exercises.find(function(x){return x.name===S.trendEx;});if(!e)return;
    var ws=e.sets.filter(function(s){return s.w!=null;}).map(function(s){return s.w;});
    if(ws.length)ep.push({x:md(k),y:Math.max.apply(null,ws)});
  });
  return weeklyCard()+'<section class="card"><h2>체중 (kg)</h2>'+chart(wp)+'</section>'
   +'<section class="card"><h2>종목별 최고 중량 (kg)</h2>'
   +(list.length?'<select id="trendEx" data-f="trendEx" aria-label="종목 선택">'+list.map(function(n){return '<option value="'+esc(n)+'"'+(n===S.trendEx?" selected":"")+'>'+esc(n)+'</option>';}).join("")+'</select>'+chart(ep):'<p class="empty">무게를 기록한 종목이 생기면 선택해서 볼 수 있어요.</p>')
   +'</section>';
}

/* ---------- 입력 중 갱신(포커스 유지) ---------- */
function refreshLive(){
  var d=day();
  var sm=document.getElementById("summary");if(sm)sm.textContent=summaryText(d);
  var bars=document.getElementById("bars");if(bars)bars.innerHTML=barsHtml(d);
  var w=document.getElementById("warns");if(w)w.innerHTML=noticeHtml(warnings(d));
  d.exercises.forEach(function(e){var el=document.querySelector('[data-vol="'+e.id+'"]');if(el)el.textContent=volText(e);});
}
function touch(){day().updatedAt=Date.now();persist(S.date);}
function findEx(id){return day().exercises.find(function(e){return e.id===id;});}

/* ---------- AI 코치 ---------- */
var coachCtl=null;
var QUICK=["오늘 세션 피드백 줘","다음 하체 루틴 짜줘","컨디션·통증 체크해줘","식단·수면 점검해줘"];
function errCopy(code){
  if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed")return "이 화면에서는 Claude 사용이 허용되지 않았어요. 아티팩트를 다시 열어 허용해 주세요.";
  if(code==="rate_limited")return "요청이 너무 많거나 사용량 한도예요. 잠시 후 다시 보내주세요.";
  if(code==="session_expired")return "로그인이 만료됐어요. 다시 로그인한 뒤 열어주세요.";
  return "연결이 잠깐 끊겼어요. 같은 메시지를 다시 보내주세요.";
}
function systemText(){
  var ks=Object.keys(S.days).filter(function(k){return hasContent(S.days[k]);}).sort();
  var wts=ks.filter(function(k){return S.days[k].weight!=null;}).slice(-6).map(function(k){return md(k)+" "+fmt(S.days[k].weight)+"kg";}).join(", ")||"없음";
  var td=S.days[TODAY]&&hasContent(S.days[TODAY])?summaryText(S.days[TODAY]):"아직 기록 없음";
  var prev=ks.filter(function(k){return k<TODAY;}).slice(-4).map(function(k){return summaryText(S.days[k]);}).join("\n\n")||"없음";
  var nm={};ks.filter(function(k){return k<=TODAY;}).slice(-5).forEach(function(k){S.days[k].exercises.forEach(function(e){nm[e.name]=1;});});
  var cls=Object.keys(nm).map(function(n){var i=info(n);return "- "+n+": "+i.muscle+(i.secondary?"(보조 "+i.secondary+")":"")+" · "+patLabel(i.pattern)+(i.assist?" · 어시스트(볼륨 제외)":"");}).join("\n")||"없음";
  var now=new Date();
  return PERSONA+"\n\n"+S.coach.profile+"\n\n[이전 대화 요약]\n"+(S.coach.summary||"(아직 없음)")+"\n\n[일일 목표] 칼로리 "+S.coach.goal.kcal+"kcal · 단백질 "+S.coach.goal.protein+"g\n\n[최근 체중] "+wts+"\n\n[오늘 기록]\n"+td+"\n\n[최근 세션]\n"+prev+"\n\n[종목 분류]\n"+cls+"\n\n오늘 날짜: "+TODAY+" (현재 시각 "+pad(now.getHours())+":"+pad(now.getMinutes())+")";
}
function msgHtml(m){return '<div class="msg '+(m.role==="user"?"user":"coach")+(m.err?" err":"")+'">'+esc(m.content)+'</div>';}
function renderCoach(){
  var c=S.coach,h="";
  if(S.sampleChecked&&!S.sample)h+='<div class="notice warn">AI 코치는 Claude에서 이 아티팩트를 열었을 때만 쓸 수 있어요. 지금 화면에서는 기록·타이머·추이만 동작합니다.</div>';
  h+='<div class="chat" id="chat">';
  if(!c.messages.length&&!S.coachBusy)h+='<div class="msg coach">왔냐 ㅋㅋ 이제 기록은 오늘 탭에 쌓고, 나한테는 여기서 물어봐.\n\n내가 오늘 기록, 최근 세션, 체중, 통증 체크를 다 보고 있으니까 숫자 다시 안 보내도 돼. 오늘 뭐부터 갈까? 💪</div>';
  h+=c.messages.map(msgHtml).join("");
  if(S.coachBusy)h+='<div class="msg coach" id="live">'+(S.liveText?esc(S.liveText):"코치 생각 중…")+'</div>';
  h+='</div>';
  h+='<div class="chips">'+QUICK.map(function(q){return '<button class="chip" data-act="coachAsk" data-q="'+esc(q)+'"'+(S.coachBusy||!S.sample?" disabled":"")+'>'+esc(q)+'</button>';}).join("")+'</div>';
  h+='<div class="coachin"><textarea id="coachInput" data-f="coachDraft" rows="2" aria-label="코치에게 메시지" placeholder="코치한테 편하게 던져…">'+esc(S.draft)+'</textarea>'
    +(S.coachBusy?'<button class="btn" data-act="coachStop">중지</button>':'<button class="btn primary" data-act="coachSend"'+(S.sample?"":" disabled")+'>보내기</button>')+'</div>';
  var n=c.messages.length;
  h+='<p class="ctx">'+(c.summary?"이전 대화 요약 보관 중 · 최근 메시지 "+n+"개":(n?"메시지 "+n+"개 · 30개 넘으면 자동 요약":""))+'</p>';
  h+='<details class="card"><summary>회원 프로필 (코치가 항상 기억해요)</summary><textarea id="f-profile" data-f="profile" aria-label="회원 프로필">'+esc(c.profile)+'</textarea><button class="btn ghost" data-act="profileReset">기본값으로 되돌리기</button></details>';
  h+='<button class="btn'+(S.armed==="clearChat"?" danger":" ghost")+'" data-act="clearChat">'+(S.armed==="clearChat"?"한 번 더 누르면 대화가 삭제돼요":"대화 비우기")+'</button>';
  return h;
}
function scrollCoach(){var el=document.getElementById("coachInput");if(el&&el.scrollIntoView)el.scrollIntoView({block:"end"});}
async function coachSend(text){
  text=(text||"").trim();
  if(!text||S.coachBusy||!S.sample)return;
  var c=S.coach;
  c.messages.push({role:"user",content:text});
  S.draft="";S.coachBusy=true;S.liveText="";
  coachPersist();render();scrollCoach();
  var turns=[{role:"user",content:systemText()}].concat(c.messages.filter(function(m){return !m.err;}).slice(-20).map(function(m){return {role:m.role,content:m.content};}));
  coachCtl=new AbortController();
  try{
    var r=await S.sample(turns,{cache:false,signal:coachCtl.signal,onText:function(u){S.liveText=u.text;var el=document.getElementById("live");if(el)el.textContent=u.text;}});
    c.messages.push({role:"assistant",content:r.text});
  }catch(e){
    if(e&&e.text)c.messages.push({role:"assistant",content:e.text+"\n(중간에 끊겼어요)"});
    if(!e||e.code!=="cancelled")c.messages.push({role:"assistant",err:true,content:errCopy(e&&e.code)});
  }
  S.coachBusy=false;S.liveText="";coachCtl=null;
  coachPersist();
  if(S.tab==="coach"){render();scrollCoach();}
  compress();
}
async function compress(){
  var c=S.coach;
  if(c.messages.length<=30||!S.sample)return;
  var n=c.messages.length-14;
  var old=c.messages.slice(0,n).filter(function(m){return !m.err;});
  try{
    var txt=old.map(function(m){return (m.role==="user"?"회원":"코치")+": "+m.content;}).join("\n");
    var r=await S.sample("다음 트레이너-회원 대화를 5~8줄로 요약해. 진행 상황, 결정 사항, 부상·컨디션 정보, 다음 계획 위주. 기존 요약이 있으면 통합해. 요약만 출력.\n\n[기존 요약]\n"+(c.summary||"없음")+"\n\n[대화]\n"+txt,{cache:false,modelTier:"quick"});
    if(c.messages.length<n)return;
    c.summary=r.text;c.messages=c.messages.slice(n);
    coachPersist();
    if(S.tab==="coach"&&!S.coachBusy)render();
  }catch(e){}
}
async function initSample(){
  try{if(window.claude&&window.claude.use)S.sample=(await window.claude.use("sample"))||null;}catch(e){S.sample=null;}
  S.sampleChecked=true;
  var a=document.activeElement;
  if(S.tab==="coach"&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();
}

function addMeal(){
  var i=document.getElementById("newMeal"),t=((i&&i.value)||"").trim();
  if(!t)return;
  day().meals.push({id:uid(),text:t,kcal:null,protein:null});
  touch();render();
}
async function estimate(){
  var d=day(),date=d.date,targets=d.meals.filter(function(m){return m.kcal==null||m.protein==null;});
  if(!targets.length||!S.sample||S.estBusy)return;
  S.estBusy=true;render();
  try{
    var list=targets.map(function(m){return {id:m.id,text:m.text};});
    var res=await S.sample.json('다음 식사 목록의 대략적인 칼로리(kcal)와 단백질(g)을 추정해. 한국 음식 기준 보통 1인분으로 가정하고, 양이 적혀 있으면 그걸 따라. JSON 배열만 출력: [{"id":"...","kcal":숫자,"protein":숫자}]\n\n'+JSON.stringify(list),{modelTier:"quick"});
    if(Array.isArray(res))res.forEach(function(r){
      var m=d.meals.find(function(x){return x.id===r.id;});if(!m)return;
      var k=num(r.kcal),pr=num(r.protein);
      if(m.kcal==null&&k!=null)m.kcal=Math.round(k);
      if(m.protein==null&&pr!=null)m.protein=Math.round(pr);
    });
    d.updatedAt=Date.now();persist(date);
  }catch(e){S.estErr=errCopy(e&&e.code);}
  S.estBusy=false;render();
}
async function backup(){
  var txt=JSON.stringify({days:S.days,coach:{summary:S.coach.summary,profile:S.coach.profile,goal:S.coach.goal}},null,1);
  var ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){}
  var b=document.getElementById("backupBtn"),ta=document.getElementById("backupText");
  if(!ok&&ta){ta.hidden=false;ta.value=txt;try{ta.select();}catch(e){}}
  if(b){b.textContent=ok?"복사했어요":"아래 글을 전체 선택해 복사하세요";}
}

async function initMcp(){
  try{if(window.claude&&window.claude.use)S.mcp=(await window.claude.use("mcp"))||null;}catch(e){S.mcp=null;}
  softRender();
}

/* ---------- 타이머 ---------- */
var T={end:0,iv:null,hideAt:null};
function startTimer(){
  var secs=+(lsGet("tlog.rest")||90);
  if(!secs)return;
  T.end=Date.now()+secs*1000;
  document.getElementById("timerbar").hidden=false;
  document.getElementById("tmsg").textContent="세트 사이 휴식";
  clearInterval(T.iv);tick();T.iv=setInterval(tick,250);
}
function tick(){
  var left=Math.ceil((T.end-Date.now())/1000);
  var el=document.getElementById("tleft");
  if(left<=0){
    clearInterval(T.iv);el.textContent="0:00";
    document.getElementById("tmsg").textContent="휴식 끝. 다음 세트";
    try{if(navigator.vibrate)navigator.vibrate(250);}catch(e){}
    return;
  }
  el.textContent=Math.floor(left/60)+":"+pad(left%60);
}
function stopTimer(){clearInterval(T.iv);document.getElementById("timerbar").hidden=true;}

/* ---------- 이벤트 ---------- */
function arm(key,fn){
  if(S.armed===key){S.armed=null;fn();return;}
  S.armed=key;render();
  setTimeout(function(){if(S.armed===key){S.armed=null;render();}},3000);
}
function addExercise(name){
  name=(name||"").trim();if(!name)return;
  var d=day();
  var last=lastOf(name,S.date);
  var sets=last?last.sets.map(function(s){return {w:s.w,r:s.r,done:false};}):[{w:null,r:null,done:false}];
  d.exercises.push({id:uid(),name:name,sets:sets});
  touch();classify([name]);render();
}
async function copySummary(){
  var txt=summaryText(day()),btn=document.getElementById("copyBtn");
  var ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){}
  if(!ok){
    var sm=document.getElementById("summary");
    try{var r=document.createRange();r.selectNodeContents(sm);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);}catch(e){}
  }
  if(btn){btn.textContent=ok?"복사했어요":"위 글을 길게 눌러 복사하세요";setTimeout(function(){btn.textContent="복사해서 채팅·옵시디언에 붙여넣기";},2500);}
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,d=day(),e;
  switch(a){
    case "tab":S.tab=b.dataset.tab;render();break;
    case "prev":S.date=shift(S.date,-1);render();break;
    case "next":S.date=shift(S.date,1);render();break;
    case "goToday":S.date=TODAY;render();break;
    case "openDay":S.date=b.dataset.date;S.tab="today";render();window.scrollTo(0,0);break;
    case "split":d.split=d.split===b.dataset.v?"":b.dataset.v;touch();render();break;
    case "diet":d.diet=d.diet===b.dataset.v?"":b.dataset.v;touch();render();break;
    case "rest":lsSet("tlog.rest",b.dataset.v);render();break;
    case "addEx":
      if(b.dataset.name)addExercise(b.dataset.name);
      else{var inp=document.getElementById("newEx");addExercise(inp&&inp.value);}
      break;
    case "delEx":
      e=findEx(b.dataset.ex);if(!e)break;
      if(e.sets.some(function(s){return s.w!=null||s.r!=null;}))arm("ex:"+e.id,function(){d.exercises=d.exercises.filter(function(x){return x.id!==e.id;});touch();render();});
      else{d.exercises=d.exercises.filter(function(x){return x.id!==e.id;});touch();render();}
      break;
    case "up":case "down":
      var i=d.exercises.findIndex(function(x){return x.id===b.dataset.ex;});
      var j=a==="up"?i-1:i+1;
      if(i>=0&&j>=0&&j<d.exercises.length){var t=d.exercises[i];d.exercises[i]=d.exercises[j];d.exercises[j]=t;touch();render();}
      break;
    case "addSet":
      e=findEx(b.dataset.ex);if(!e)break;
      var ls=e.sets[e.sets.length-1];
      e.sets.push({w:ls?ls.w:null,r:ls?ls.r:null,done:false});touch();render();break;
    case "delSet":
      e=findEx(b.dataset.ex);if(!e)break;
      e.sets.splice(+b.dataset.i,1);touch();render();break;
    case "done":
      e=findEx(b.dataset.ex);if(!e)break;
      var s=e.sets[+b.dataset.i];if(!s)break;
      s.done=!s.done;touch();render();if(s.done)startTimer();break;
    case "painAdd":d.pain[b.dataset.area]={level:1,note:""};touch();render();break;
    case "painDel":delete d.pain[b.dataset.area];touch();render();break;
    case "painLv":
      if(d.pain[b.dataset.area]){d.pain[b.dataset.area].level=+b.dataset.lv;touch();render();}break;
    case "morning":d.morning=b.dataset.v;touch();render();break;
    case "copy":copySummary();break;
    case "addMeal":addMeal();break;
    case "editEx":S.editEx=S.editEx===b.dataset.ex?"":b.dataset.ex;render();break;
    case "classifyAll":classifyAll();break;
    case "obsSave":saveObsidian(d);break;
    case "delMeal":d.meals=d.meals.filter(function(m){return m.id!==b.dataset.m;});touch();render();break;
    case "estimate":estimate();break;
    case "closeDay":closeDay();break;
    case "backup":backup();break;
    case "coachSend":var ci=document.getElementById("coachInput");coachSend(ci&&ci.value);break;
    case "coachAsk":coachSend(b.dataset.q);break;
    case "coachStop":if(coachCtl)coachCtl.abort();break;
    case "profileReset":S.coach.profile=PROFILE_DEFAULT;coachPersist();render();break;
    case "clearChat":arm("clearChat",function(){S.coach.messages=[];S.coach.summary="";coachPersist();render();});break;
    case "timerStop":stopTimer();break;
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target,f=t.dataset&&t.dataset.f;if(!f)return;
  var d=day();
  if(f==="coachDraft"){S.draft=t.value;return;}
  if(f==="profile"){S.coach.profile=t.value;coachPersist();return;}
  if(f==="mk"||f==="mp"){var mm=d.meals.find(function(x){return x.id===t.dataset.m;});if(!mm)return;mm[f==="mk"?"kcal":"protein"]=num(t.value);touch();refreshLive();return;}
  if(f==="goalK"||f==="goalP"){var gv=num(t.value);if(gv!=null&&gv>0){S.coach.goal[f==="goalK"?"kcal":"protein"]=gv;coachPersist();refreshLive();}return;}
  if(f==="w"||f==="r"){
    var e=findEx(t.dataset.ex);if(!e||!e.sets[+t.dataset.i])return;
    e.sets[+t.dataset.i][f]=num(t.value);
  }else if(f==="weight"||f==="sleep"){d[f]=num(t.value);}
  else if(f==="note"){d.note=t.value;}
  else if(f==="painNote"){if(d.pain[t.dataset.area])d.pain[t.dataset.area].note=t.value;}
  else return;
  touch();refreshLive();
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  var f=t.dataset&&t.dataset.f;
  if(f==="trendEx"){S.trendEx=t.value;render();}
  else if(f==="exMuscle"||f==="exPattern"||f==="exAssist"){
    var e=findEx(t.dataset.ex);if(!e)return;
    var cur=Object.assign({},info(e.name));
    if(f==="exMuscle")cur.muscle=t.value;else if(f==="exPattern")cur.pattern=t.value;else cur.assist=!!t.checked;
    cur.src="직접";S.coach.exInfo[e.name]=cur;coachPersist();render();
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id==="newEx"){ev.preventDefault();addExercise(ev.target.value);}
  if(ev.key==="Enter"&&ev.target.id==="newMeal"){ev.preventDefault();addMeal();}
  if(ev.key==="Enter"&&!ev.shiftKey&&!ev.isComposing&&ev.target.id==="coachInput"){ev.preventDefault();coachSend(ev.target.value);}
});

/* ---------- 시작 ---------- */
lsLoad();
coachLoad();
setSync("local");
render();
initDb();
initSample();
initMcp();
})();
</script>
